<!DOCTYPE html>

<html lang="pt-BR">

	<head>
		<meta charset="UTF-8">
		<title>Clock API</title>
		<meta name="viewport" content="width-device, initial-scale=1.0">
		<link rel="stylesheet" href="css/style.css">
		<script defer src="js/script.js"></script>
	</head>

	<body>

		<main id="mainContainer">
		  <div class="containerClock">
		    <h2 class="clockTitle">São Paulo</h2>
		    <p class="clockTime" id="clock-sp">00:00:00</p>
		  </div>

		  <div class="containerClock">
		    <h2 class="clockTitle">New York</h2>
		    <p class="clockTime" id="clock-ny">00:00:00</p>
		  </div>

		  <div class="containerClock">
		    <h2 class="clockTitle">London</h2>
		    <p class="clockTime" id="clock-lon">00:00:00</p>
		  </div>

		  <div class="containerClock">
		    <h2 class="clockTitle">Tokyo</h2>
		    <p class="clockTime" id="clock-tok">00:00:00</p>
		  </div>
		</main>
	</body>

</html>
