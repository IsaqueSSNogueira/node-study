<!DOCTYPE html>

<html lang="pt-BR">

 <head>
 	<meta charset="UTF-8">
 	<title>To Do List (Node.js)</title>
 	<meta name="viewport" content="width=device-width, initial-scale=1.0">
 	<link rel="stylesheet" href="css/style.css">
 	<script src="js/main.js" type="module"></script>
 	<script src="https://kit.fontawesome.com/2dce24cdd9.js" crossorigin="anonymous"></script>
 </head>

 <body>

 	<!-- base -->
 	<main id="appContainer">
		
		<!-- header -->
		<header>
			<div id="containerIcon">
				<i class="fa-regular fa-clipboard" id="icon"></i>
			</div>
 			<h1>To do <span>List</span></h1>
 		</header>



 		<!-- Authentication Screen -->
 		<div id="authScreen">

 			<!-- login -->
 			<div id="loginScreen" class="authContentBox">
 				<h2>Login</h2>

 				<!-- form -->
 				<form class="authForm" autocomplete="off">
 					<input type="text" class="formInput" placeholder="Usuário" id="userInputLogin">
 					<input type="password" class="formInput" minlength="5" maxlength="30" placeholder="Senha" id="passwordInputLogin">
 					<button class="authButton" id="signInButton">Entrar</button>
 				</form>

 				<!-- tab switcher -->
 				<div class="tabSwitcherContainer">
			  		Não possui conta?
			  		<button class="tabSwitcherButton" data-mode="register">Registar</button>
			  	</div>
 			</div>

 			<!-- register -->
 			<div id="registerScreen" class="authContentBox">
 				<h2>Registrar</h2>

 				<!-- form -->
 				<form class="authForm" autocomplete="off">
 					<input type="text" class="formInput" placeholder="Usuário" id="userInputRegister">
 					<input type="password" class="formInput" minlength="5" maxlength="30" placeholder="Senha" id="passwordInputRegister">
 					<button class="authButton" id="signUpButton">Registrar</button>
 				</form>

 				<!-- tab switcher -->
 				<div class="tabSwitcherContainer">
 					Já possui conta?
					<button class="tabSwitcherButton" data-mode="login">Login</button>
				</div>
 			</div>
 		</div>



 		<!-- user tasks screen -->

 		<div id="taskScreen"  class="hidden">

 			<!-- task tab -->
		 	<div id="taskTabContainer">
		 		<div id="taskTabWrapper">
					<div class="taskTab activeTab">
						<button>
							<i class="fa-brands fa-flipboard"></i>
							To Do
							<span class="taskCount">2</span>
						</button>
					</div>
					<div class="taskTab">
						<button>
							<i class="fa-regular fa-circle-check"></i>
							Done
							<span class="taskCount">0</span>
						</button>
					</div>
		 		</div>
			</div>

 			<!-- tasks container -->
 			<div id="taskContainer">

 				<!-- example
 				<div class="taskBox">
 					// status task
 					<input type="checkbox" class="checkboxTask">

 					// info task
 					<div class="infoTaskContainer">
 						<div class="inputTaskContainer">
	 						<input type="text" class="inputTask" value="task" disabled>
 						</div>
 						<button class="descriptionTaskButton">
							<i class="fa-solid fa-circle-info icon"></i>
 							Descrição
 						</button>
 					</div>
 					
 					// more actions
 					<button class="moreActionsTaskButton">
 						<i class="fa-solid fa-ellipsis-vertical icon"></i>
 					</button>
 				</div> 
 				-->



 			</div>

 			<!-- task screen footer -->
 			<footer id="taskScreenFooter">
	 			<!-- add task -->
	 			<div id="addTaskContainer">
	 				<input type="text" id="newTaskInput" placeholder="Nova tarefa..." autocomplete="off">
	 				<button id="newTaskButton">
	 					+
	 				</button>
	 			</div>
	 			<p id="footerPhase">
	 				<i class="fa-solid fa-wand-magic-sparkles icon"></i>
	 				Organize suas tarefas. Conquiste seus objetivos.
	 			</p>
 			</footer>
 		</div>

 	</main>

 </body>

</html>
