<!DOCTYPE html>

<html lang="pt-BR">

 <head>
 	<meta charset="UTF-8">
 	<title>To Do List (Node.js)</title>
 	<meta name="viewport" content="width=device-width, initial-scale=1.0">
 	<link rel="stylesheet" href="css/style.css">
 	<script src="js/main.js" type="module"></script>
 	<script src="https://kit.fontawesome.com/2dce24cdd9.js" crossorigin="anonymous"></script>
 </head>

 <body>

 	<!-- base -->
 	<main id="appContainer">
		
		<!-- header -->
		<header>
			<div id="containerIcon">
				<i class="fa-regular fa-clipboard" id="icon"></i>
			</div>
 			<h1>To do <span>List</span></h1>
 		</header>



 		<!-- Authentication Screen -->
 		<div id="authScreen">

 			<!-- login -->
 			<div id="loginScreen" class="authContentBox">
 				<h2>Login</h2>

 				<!-- form -->
 				<form class="authForm" autocomplete="off">
 					<input type="text" class="formInput" placeholder="Usuário" id="userInputLogin">
 					<input type="password" class="formInput" minlength="5" maxlength="30" placeholder="Senha" id="passwordInputLogin">
 					<button class="authButton" id="signInButton">Entrar</button>
 				</form>

 				<!-- tab switcher -->
 				<div class="tabSwitcherContainer">
			  		Não possui conta?
			  		<button class="tabSwitcherButton" data-mode="register">Registar</button>
			  	</div>
 			</div>

 			<!-- register -->
 			<div id="registerScreen" class="authContentBox">
 				<h2>Registrar</h2>

 				<!-- form -->
 				<form class="authForm" autocomplete="off">
 					<input type="text" class="formInput" placeholder="Usuário" id="userInputRegister">
 					<input type="password" class="formInput" minlength="5" maxlength="30" placeholder="Senha" id="passwordInputRegister">
 					<button class="authButton" id="signUpButton">Registrar</button>
 				</form>

 				<!-- tab switcher -->
 				<div class="tabSwitcherContainer">
 					Já possui conta?
					<button class="tabSwitcherButton" data-mode="login">Login</button>
				</div>
 			</div>
 		</div>



 		<!-- user tasks screen -->

 		<div id="taskScreen"  class="hidden">

 			<!-- task tab -->
		 	<div id="taskTabContainer">
				<div class="taskTabArea selectTab">
					<button>To Do</button>
				</div>
				<div class="taskTabArea">
					<button>Done</button>
				</div>
			</div>

 			<!-- tasks container -->
 			<div id="taskContainer">

 				<!-- example -->
 				<div class="taskBox">
 					<input type="checkbox" class="checkboxTask">
 					<input type="text" class="inputTask" placeholder="task" disabled>
 					<button>
 						<i class="fa-solid fa-ellipsis-vertical"></i>
 					</button>
 				</div>

 			</div>

 			<!-- add task -->
 			<div id="addTaskContainer">
 				<input type="text" id="newTaskInput" placeholder="Nova tarefa" autocomplete="off">
 				<button id="newTaskButton">
 					<i class="fa-solid fa-circle-chevron-up" id="icon"></i>	
 				</button>
 			</div>

 		</div>

 	</main>

 </body>

</html>
